name: Formal verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    name: Extract and verify F* and ProVerif
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: false

      - name: Use read-only proof-tool caches
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hax
          skipPush: true
          extraPullNames: fstar-nix-versions,z3-nix-versions

      - name: Regenerate and verify formal proof artifacts
        run: make -C beaconcrypt-core check-generated
