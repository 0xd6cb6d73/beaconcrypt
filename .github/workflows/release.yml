name: Release

on:
  push:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-build:
    uses: ./.github/workflows/wasm.yml
    permissions:
      contents: read

  unix-build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build
      run: |
        rustup component add rust-src --toolchain nightly
        cargo +nightly rustc -p beaconcrypt-ffi --release -Z build-std=std,panic_abort --no-default-features --features gobinds --crate-type=staticlib
        mv target/release/libbeaconcrypt.a target/release/libbeaconcrypt-gobinds-${{ matrix.os }}.a
        cargo +nightly rustc -p beaconcrypt-ffi --release -Z build-std=std,panic_abort --no-default-features --features std,beacon --crate-type=staticlib
        mv target/release/libbeaconcrypt.a target/release/libbeaconcrypt-beacon-${{ matrix.os }}.a
    # Proof-source guards retain the old adapter until the separately deferred proof migration.
    - name: Run runtime tests (proof-source migration deferred)
      run: >-
        cargo test --verbose --workspace --locked --
        --skip free_schedule_rust_fidelity_annotations_are_exact
        --skip mldsa_transcript_source_and_model_mutations_are_rejected
        --skip production_manifest_symbolic_model_and_adapters_are_exact
        --skip proverif_verdict_classes_cover_every_checker_and_profile
        --skip registration_lifecycle_mutation_matrix_is_complete_and_rejected
    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: beaconcrypt-static-${{ matrix.os }}
        path: target/release/libbeaconcrypt-*.a
        retention-days: 1

  windows-build:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build
      run: |
        rustup component add rust-src --toolchain nightly-msvc
        cargo +nightly rustc -p beaconcrypt-ffi --release -Z build-std=std,panic_abort --no-default-features --features gobinds --crate-type=staticlib
        mv target/release/beaconcrypt.lib target/release/beaconcrypt-gobinds-${{ matrix.os }}.lib
        cargo +nightly rustc -p beaconcrypt-ffi --release -Z build-std=std,panic_abort --no-default-features --features std,beacon --crate-type=staticlib
        mv target/release/beaconcrypt.lib target/release/beaconcrypt-beacon-${{ matrix.os }}.lib
        ls target/release
    # Proof-source guards retain the old adapter until the separately deferred proof migration.
    - name: Run runtime tests (proof-source migration deferred)
      run: >-
        cargo test --verbose --workspace --locked --
        --skip free_schedule_rust_fidelity_annotations_are_exact
        --skip mldsa_transcript_source_and_model_mutations_are_rejected
        --skip production_manifest_symbolic_model_and_adapters_are_exact
        --skip proverif_verdict_classes_cover_every_checker_and_profile
        --skip registration_lifecycle_mutation_matrix_is_complete_and_rejected
    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: beaconcrypt-static-${{ matrix.os }}
        path: target/release/beaconcrypt-*.lib
        retention-days: 1

  windows-mingw-build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up MinGW UCRT64
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        install: mingw-w64-ucrt-x86_64-gcc
    - name: Add MinGW UCRT64 to PATH
      run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH'
    - name: Build
      env:
        CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
      run: |
        rustup target add x86_64-pc-windows-gnu --toolchain nightly
        rustup component add rust-src --toolchain nightly
        cargo +nightly rustc -p beaconcrypt-ffi --release -Z build-std=std,panic_abort --target x86_64-pc-windows-gnu --no-default-features --features gobinds --crate-type=staticlib
        mv target/x86_64-pc-windows-gnu/release/libbeaconcrypt.a target/x86_64-pc-windows-gnu/release/libbeaconcrypt-gobinds-windows-mingw-x86_64.a
        cargo +nightly rustc -p beaconcrypt-ffi --release -Z build-std=std,panic_abort --target x86_64-pc-windows-gnu --no-default-features --features std,beacon --crate-type=staticlib
        mv target/x86_64-pc-windows-gnu/release/libbeaconcrypt.a target/x86_64-pc-windows-gnu/release/libbeaconcrypt-beacon-windows-mingw-x86_64.a
        ls target/x86_64-pc-windows-gnu/release
    # Proof-source guards retain the old adapter until the separately deferred proof migration.
    - name: Run runtime tests (proof-source migration deferred)
      env:
        CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
      run: >-
        cargo test --verbose --workspace --target x86_64-pc-windows-gnu --locked --
        --skip free_schedule_rust_fidelity_annotations_are_exact
        --skip mldsa_transcript_source_and_model_mutations_are_rejected
        --skip production_manifest_symbolic_model_and_adapters_are_exact
        --skip proverif_verdict_classes_cover_every_checker_and_profile
        --skip registration_lifecycle_mutation_matrix_is_complete_and_rejected
    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: beaconcrypt-static-windows-mingw-x86_64
        path: target/x86_64-pc-windows-gnu/release/libbeaconcrypt-*.a
        retention-days: 1

  release:
    needs: [unix-build, windows-build, windows-mingw-build, wasm-build]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Download release artifact
      uses: actions/download-artifact@v8
      with:
        path: ./dist
        pattern: beaconcrypt-*
        merge-multiple: true
    - name: Publish built binary to GitHub releases
      run: |
        cp LICENSE ./dist/LICENSE-0BSD
        cp beaconcrypt-parse/generated/LICENSE ./dist/LICENSE-Apache-2.0
        gh release create ${{ github.ref_name }} --notes-from-tag ./dist/*
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
