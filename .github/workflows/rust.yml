name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build
      run: cargo build --verbose
    - name: Check PQXDH server build
      env:
        RUSTFLAGS: -Dwarnings
      run: cargo check -p beaconcrypt --no-default-features --features pqxdh,server --lib
    - name: Check PQXDH beacon build
      env:
        RUSTFLAGS: -Dwarnings
      run: cargo check -p beaconcrypt --no-default-features --features pqxdh,beacon --lib
    - name: Run tests
      run: cargo test --verbose --workspace
    - name: Preserve property-test failure seeds
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: property-regressions
        path: |
          beaconcrypt/proptest-regressions/*.txt
          beaconcrypt-parse/proptest-regressions/*.txt
        if-no-files-found: ignore
    - name: Test C persistence callbacks
      run: |
        cargo test -p beaconcrypt --features cbinds --lib --locked
        cargo build -p beaconcrypt --features cbinds --locked
        cc -std=c11 -Wall -Wextra -Werror -Ibeaconcrypt beaconcrypt/tests/c_persistence.c -Ltarget/debug -lbeaconcrypt -Wl,-rpath,"$PWD/target/debug" -o target/c-persistence
        target/c-persistence
