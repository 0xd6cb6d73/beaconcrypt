# This workflow builds and uploads a Python package to PyPI when a tag is pushed.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Set up Python
        run: uv python install 3.14

      - name: Run Python tests
        run: |
          uv run maturin develop --uv
          uv run pytest tests

      - name: Generate Python stubs
        run: uv run python scripts/generate_python_stubs.py

  sdist:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      deployments: read

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Set up Python
        run: uv python install 3.14

      - name: Generate Python stubs
        run: uv run python scripts/generate_python_stubs.py

      - name: Build source distribution
        run: uv run maturin sdist --out dist

      - name: Check source distribution parser and license files
        run: |
          uv run python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile

          sdists = list(Path("dist").glob("*.tar.gz"))
          if not sdists:
              raise RuntimeError("No source distribution found")
          for path in sdists:
              root = path.name.removesuffix(".tar.gz")
              with tarfile.open(path, "r:gz") as archive:
                  metadata = BytesParser().parsebytes(archive.extractfile(f"{root}/PKG-INFO").read())
                  for license_file in metadata.get_all("License-File", []):
                      if not archive.getmember(f"{root}/{license_file}").isfile():
                          raise RuntimeError(f"Missing license file in {path}: {license_file}")
                  parser_files = (
                      "Cargo.toml",
                      "LICENSE-0BSD",
                      "README.md",
                      "generated/LICENSE",
                      "generated/README.md",
                      "schema/transport.cddl",
                      "scripts/regenerate.py",
                      "src/lib.rs",
                      "src/preflight_tests.rs",
                      "src/sizing.rs",
                      "src/generated/cbordetver.rs",
                      "src/generated/cbordetveraux.rs",
                      "src/generated/transport.rs",
                      "tests/codec.rs",
                  )
                  for parser_file in parser_files:
                      member = f"{root}/beaconcrypt-parse/{parser_file}"
                      if not archive.getmember(member).isfile():
                          raise RuntimeError(f"Missing parser file in {path}: {parser_file}")
              print(f"Validated parser and license files in {path}")
          PY

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/

  wheels:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      deployments: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Set up Python
        run: uv python install 3.14

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        with:
          output-dir: dist/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: release-wheels-${{ matrix.os }}
          path: dist/

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs:
      - sdist
      - wheels
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/project/beaconcrypt/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
