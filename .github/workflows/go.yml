name: Go Module

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GOPROXY: https://proxy.golang.org
  GONOSUMDB: ""

jobs:
  wasm:
    uses: ./.github/workflows/wasm.yml

  test:
    name: Test Go module on ${{ matrix.os }}
    needs: wasm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wasm-generated
          path: internal/wasm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up MinGW UCRT64 on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MinGW UCRT64 to PATH on Windows
        if: runner.os == 'Windows'
        run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH'

      - name: Build native library
        if: runner.os != 'Windows'
        run: cargo build --verbose -p beaconcrypt-ffi --release --features gobinds

      - name: Build native library on Windows
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build --verbose -p beaconcrypt-ffi --release --target x86_64-pc-windows-gnu --features gobinds

      - name: Test Go module
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: 1
        run: |
          CGO_ENABLED=1 go test -race ./...
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=1 go test -race -tags=beaconcrypt_wazero ./...
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=1 go vet -tags=beaconcrypt_wazero ./...

      - name: Test Go module on Windows
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: 1
          CC: gcc
        shell: bash
        run: |
          CGO_ENABLED=1 go test -race ./...
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=1 go test -race -tags=beaconcrypt_wazero ./...
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=1 go vet -tags=beaconcrypt_wazero ./...

      - name: Test native and Wasm interoperability through the public API
        if: runner.os != 'Windows'
        run: |
          mkdir -p .build
          CGO_ENABLED=1 go build -o .build/interop-native ./testdata/interop
          CGO_ENABLED=0 go build -tags=beaconcrypt_wazero -o .build/interop-wasm ./testdata/interop
          python3 scripts/test-wasm-interop.py --native .build/interop-native --wasm .build/interop-wasm

  cross-build:
    name: Cross-build CGO-free consumers and release bundle
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: wasm-generated
          path: internal/wasm
      - name: Build the existing consumer unchanged
        run: |
          mkdir -p target/wasm-consumers
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            IFS=/ read -r go_os go_arch <<< "$target"
            CGO_ENABLED=0 GOOS="$go_os" GOARCH="$go_arch" go build -trimpath \
              -o "target/wasm-consumers/$go_os-$go_arch" ./examples/go/main.go
          done
      - uses: actions/download-artifact@v8
        with:
          name: beaconcrypt-wasm-release
          path: dist/wasm
      - name: Test the released module, outside the Git checkout
        run: |
          cd dist/wasm
          sha256sum -c SHA256SUMS
          tar -xzf beaconcrypt-go-*-wasm.tar.gz
          cd beaconcrypt-go-*/
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=1 go test -tags=beaconcrypt_wazero ./...

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, cross-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Publish module to Go proxy
        run: |
          module_path="$(go list -m)"
          go_version="${GITHUB_REF_NAME}"

          git fetch origin "refs/tags/${go_version}:refs/tags/${go_version}" || true
          if ! git rev-parse --verify --quiet "refs/tags/${go_version}" >/dev/null; then
            git tag "${go_version}" "${GITHUB_SHA}"
            git push origin "refs/tags/${go_version}"
          fi

          tag_visible=false
          for attempt in {1..30}; do
            if git ls-remote --exit-code --tags origin "refs/tags/${go_version}" >/dev/null; then
              tag_visible=true
              break
            fi
            sleep 10
          done
          if [ "${tag_visible}" != "true" ]; then
            echo "Timed out waiting for ${go_version} to become visible on origin" >&2
            exit 1
          fi

          GOPROXY=direct go list -m "${module_path}@${go_version}"

          for attempt in {1..30}; do
            if go list -m "${module_path}@${go_version}"; then
              exit 0
            fi
            sleep 10
          done

          go list -m "${module_path}@${go_version}"
