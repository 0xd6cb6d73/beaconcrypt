[package]
name = "beaconcrypt-protocol-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "../../LICENSE"
publish = false
description = "Extractable protocol state transitions for beaconcrypt"

[features]
proverif = ["dep:hax-lib"]

[dependencies]
hax-lib = { version = "=0.3.7", optional = true }
zeroize = { version = "1.9", default-features = false, features = ["zeroize_derive"] }

[lib]
name = "beaconcrypt_protocol_core"
path = "src/lib.rs"
