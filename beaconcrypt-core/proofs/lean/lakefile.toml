name = "BeaconcryptCore"
version = "0.1.0"
defaultTargets = ["BeaconcryptCore"]

[[lean_lib]]
name = "BeaconcryptCore"
# Build the maintained root and every project module.
# The explicit submodule glob prevents a new proof file from being silently omitted if its root import is missed.
globs = ["BeaconcryptCore", "BeaconcryptCore.*"]

[[require]]
name = "aeneas"
git = "https://github.com/cryspen/aeneas"
rev = "nightly-2026.08.24-f8a0eb8"
subDir = "backends/lean"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[require]]
name = "Hax"
git = { url = "https://github.com/cryspen/hax-lean" }
rev = "v0.3.12"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "cbd4144b51d92da00dd50f05e068b2348fa6e529"
