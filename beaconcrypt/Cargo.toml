[package]
name = "beaconcrypt"
version = "0.6.1"
edition = "2024"
license-file = "../LICENSE"
readme = "../README.md"
description = "Cryptographic transport for C2 channels"
rust-version = "1.96"
repository = "https://github.com/0xd6cb6d73/beaconcrypt"

[lib]
name = "beaconcrypt"
crate-type = ["cdylib", "staticlib", "rlib"]

[[example]]
name = "rust"
path = "examples/rust/main.rs"
required-features = ["pqxdh", "beacon", "server"]

[[example]]
name = "sqlite"
path = "examples/sqlite/main.rs"
required-features = ["pqxdh", "beacon", "server"]

[[example]]
name = "persistence_bench"
path = "examples/persistence_bench/main.rs"
required-features = ["pqxdh", "beacon", "server"]

[[test]]
name = "row_persistence"
path = "tests/row_persistence.rs"
required-features = ["pqxdh", "beacon", "server"]

[[test]]
name = "beacon"
path = "tests/beacon.rs"
required-features = ["pqxdh", "beacon", "server"]

[[test]]
name = "protocol"
path = "tests/protocol.rs"
required-features = ["pqxdh", "beacon", "server"]

[[test]]
name = "rooterberg"
path = "tests/rooterberg.rs"
required-features = ["pqxdh"]

[[test]]
name = "server"
path = "tests/server.rs"
required-features = ["pqxdh", "beacon", "server"]

[[test]]
name = "wycheproof"
path = "tests/wycheproof.rs"
required-features = ["pqxdh"]

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
beaconcrypt-core = { path = "../beaconcrypt-core", features = ["test-utils"] }
proptest = { version = "1", default-features = false, features = ["std"] }
postgres = "0.19.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dependencies]
beaconcrypt-core = { version = "0.1.1", path = "../beaconcrypt-core" }
beaconcrypt-parse = { version = "0.1.0", path = "../beaconcrypt-parse" }
libsodium-rs = "=0.3.0"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.9"
pyo3 = { version = "0.30.1", features = ["abi3-py311", "experimental-inspect"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["beacon", "server", "pqxdh"]
server = ["pqxdh", "dep:serde", "dep:serde_json"]
beacon = ["pqxdh"]
pqxdh = []
gobinds = ["cbinds"]
cbinds = ["beacon", "server", "pqxdh"]
pybinds = ["dep:pyo3", "beacon", "server", "pqxdh"]
all = ["gobinds", "pybinds", "cbinds"]

[package.metadata.maturin]
name = "beaconcrypt"
bindings = "pyo3"
