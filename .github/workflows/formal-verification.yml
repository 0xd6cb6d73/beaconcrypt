name: Formal verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof_components:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: F*
            target: check-generated-fstar
          - name: ProVerif CTX commitment
            target: check-generated-proverif-aead-commitment
          - name: ProVerif no-CTX control
            target: check-generated-proverif-aead-no-commitment
          - name: ProVerif baseline
            target: check-generated-proverif-baseline
          - name: ProVerif reachability
            target: check-generated-proverif-reachability
          - name: ProVerif compromise
            target: check-generated-proverif-compromise
          - name: ProVerif failed receive
            target: check-generated-proverif-failed-receive
          - name: ProVerif failed-receive reachability
            target: check-generated-proverif-failed-receive-reachability
          - name: ProVerif failed-receive compromise
            target: check-generated-proverif-failed-receive-compromise
          - name: ProVerif failed-receive compromise reachability
            target: check-generated-proverif-failed-receive-compromise-reachability

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: false

      - name: Use read-only proof-tool caches
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hax
          skipPush: true
          extraPullNames: fstar-nix-versions,z3-nix-versions

      - name: Regenerate and verify formal proof artifacts
        run: make -C beaconcrypt-core ${{ matrix.target }}

  proofs:
    name: Extract and verify F* and ProVerif
    if: ${{ always() }}
    needs: proof_components
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Confirm every proof component passed
        env:
          PROOF_COMPONENTS_RESULT: ${{ needs.proof_components.result }}
        run: test "$PROOF_COMPONENTS_RESULT" = success
