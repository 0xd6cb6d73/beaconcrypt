additional_cargo_args = ["--locked"]

# Mutants in protocol-core must also be exercised by beaconcrypt's integration and vector tests.
test_workspace = true

# Keep local scratch copies small. CI uses --in-place.
gitignore = true

# These feature-gated adapters are tested through Go and Python rather than cargo test.
# cargo-mutants does not evaluate cfg predicates, so default-feature runs would otherwise report
# mutations in these files as missed without compiling them.
exclude_globs = [
	"src/cbinds.rs",
	"src/pybinds.rs",
]

# These mutations differ only for states that the public constructors and persistence validation
# cannot create: one-sided ratchet caches, out-of-range private ratchet offsets, or incorrectly
# sized fixed-array key material. Keep the full mutant name so source changes force re-evaluation.
exclude_re = [
	"^src/shared\\.rs:581:44: replace \\|\\| with && in RatchetManager::ratchet_send$",
	"^src/shared\\.rs:658:4: replace \\|\\| with && in RatchetManager::init_ratchets$",
	"^src/shared\\.rs:1123:3: replace \\|\\| with && in build_commitment$",
]
