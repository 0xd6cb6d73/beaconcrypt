additional_cargo_args = ["--locked"]

# Mutants in beaconcrypt-core must also be exercised by beaconcrypt's integration and vector tests.
test_workspace = true

# Keep local scratch copies small. CI uses --in-place.
gitignore = true

# These feature-gated adapters are tested through Go and Python rather than cargo test.
# cargo-mutants does not evaluate cfg predicates, so default-feature runs would otherwise report
# mutations in these files as missed without compiling them.
exclude_globs = [
	"beaconcrypt/src/cbinds.rs",
	"beaconcrypt/src/pybinds.rs",
]

# These mutations differ only for states that the public constructors and persistence validation cannot create: out-of-range private ratchet offsets, inconsistent results from pure core transitions, or out-of-range private cache indices.
# The bounded lookup's remaining counter is also redundant at runtime with its independently advancing, capacity-checked slot, but is retained as the extraction backend's explicit termination measure.
# Keep the full mutant name so source changes force re-evaluation.
exclude_re = [
	"^beaconcrypt-core/src/ratchet/control\\.rs:369:18: replace > with >= in lookup_receive_key$",
	"^beaconcrypt-core/src/ratchet/control\\.rs:385:13: replace -= with \\+= in lookup_receive_key$",
	"^beaconcrypt-core/src/ratchet/control\\.rs:385:13: replace -= with /= in lookup_receive_key$",

	# These guards repeat guarantees from pure transitions and private continuation bookkeeping.
	"^beaconcrypt-core/src/ratchet/concrete\\.rs:141:50: replace \\|\\| with && in begin_send$",
	"^beaconcrypt-core/src/ratchet/concrete\\.rs:369:4: replace \\|\\| with && in ReceiveKdf<Context>::resume$",
	"^beaconcrypt-core/src/ratchet/concrete\\.rs:370:4: replace \\|\\| with && in ReceiveKdf<Context>::resume$",
	"^beaconcrypt-core/src/ratchet/concrete\\.rs:371:4: replace \\|\\| with && in ReceiveKdf<Context>::resume$",
	"^beaconcrypt-core/src/ratchet/concrete\\.rs:574:4: replace \\|\\| with && in ReceiveAdvanceKdf::resume$",
	"^beaconcrypt-core/src/ratchet/concrete\\.rs:575:4: replace \\|\\| with && in ReceiveAdvanceKdf::resume$",
	"^beaconcrypt-core/src/ratchet/concrete\\.rs:576:4: replace \\|\\| with && in ReceiveAdvanceKdf::resume$",

	# These helpers are compiled only as support for the excluded C and Python adapters.
	"^beaconcrypt/src/persistence\\.rs:[0-9]+:[0-9]+: .*BindingSnapshotStore",
]
