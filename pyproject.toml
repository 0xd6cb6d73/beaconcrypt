[build-system]
requires = ["maturin>=1.14,<2.0" ,"pip"]
build-backend = "maturin"

[project]
name = "beaconcrypt"
requires-python = ">=3.11"
license-files = ["LICENSE", "beaconcrypt-parse/generated/LICENSE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
bindings = "pyo3"
features = ["pybinds"]
# Git preserves the native wrapper's parent-relative shared-source lib path.
# Cargo's package generator strips that target because its source is outside the crate.
sdist-generator = "git"
include = ["beaconcrypt.pyi"]
exclude = [
    { path = "rooterberg", format = "sdist" },
    { path = "wycheproof", format = "sdist" },
    { path = "beaconcrypt-core/proofs/**/*", format = "sdist" },
    { path = "doc/**/*", format = "sdist" },
]
manifest-path = "beaconcrypt-ffi/Cargo.toml"

[tool.uv]
# `maturin develop` owns the native extension installed in the development
# environment. Prevent uv's automatic project sync from replacing it with a
# cached editable build before commands such as `uv run pytest`.
package = false

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "maturin>=1.14,<2.0",
    "pycryptodome>=3.23.0",
]

[tool.cibuildwheel]
# Use uv and build
build-frontend = "build[uv]"

[tool.cibuildwheel.linux]
before-all = """
if command -v dnf >/dev/null 2>&1; then
  dnf install -y libffi-devel
elif command -v yum >/dev/null 2>&1; then
  yum install -y libffi-devel
elif command -v microdnf >/dev/null 2>&1; then
  microdnf install -y libffi-devel
elif command -v apk >/dev/null 2>&1; then
  apk add --no-cache libffi-dev
else
  echo "No supported package manager found for installing libffi" >&2
  exit 1
fi
"""
